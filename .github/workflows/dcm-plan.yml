name: DCM Deploy DEV & QA

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.20"

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml << EOF
          [default]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          authenticator = "WORKLOAD_IDENTITY"
          role = "ACCOUNTADMIN"
          warehouse = "COMPUTE_WH"
          EOF
          chmod 0600 ~/.snowflake/connections.toml

      - name: DCM Plan - DEV
        run: snow dcm plan --target DEV -c default

      - name: DCM Deploy - DEV
        run: snow dcm deploy --target DEV --alias "pr-${{ github.event.number }}" -c default

  deploy-qa:
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.20"

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml << EOF
          [default]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          authenticator = "WORKLOAD_IDENTITY"
          role = "ACCOUNTADMIN"
          warehouse = "COMPUTE_WH"
          EOF
          chmod 0600 ~/.snowflake/connections.toml

      - name: DCM Plan - QA
        run: snow dcm plan --target QA -c default

      - name: DCM Deploy - QA
        run: snow dcm deploy --target QA --alias "pr-${{ github.event.number }}" -c default
