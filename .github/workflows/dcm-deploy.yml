name: DCM Deploy PROD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.20"

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml << EOF
          [default]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          authenticator = "WORKLOAD_IDENTITY"
          role = "ACCOUNTADMIN"
          warehouse = "COMPUTE_WH"
          EOF
          chmod 0600 ~/.snowflake/connections.toml

      - name: DCM Plan - PROD
        run: snow dcm plan --target PROD -c default

      - name: DCM Deploy - PROD
        run: snow dcm deploy --target PROD --alias "gh-${{ github.sha }}" -c default
